<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
    <link rel="icon" href="{{ relURL "img/UA-COLOUR.png" }}" type="image/png" />
    {{ range .AlternativeOutputFormats -}}
      {{ printf `<link rel="%s" type="%s" href="%s" title="%s" />` .Rel .MediaType.Type .Permalink $.Site.Title | safeHTML }}
    {{ end -}}
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,600" />
    <link rel="stylesheet" href="{{ relURL "css/all.min.css" }}" />
    <link rel="stylesheet" href="{{ relURL "css/bootstrap.min.css" }}" />
    <link rel="stylesheet" href="{{ relURL "css/templatemo-style.css" }}" />
    <link rel="stylesheet" href="{{ relURL "css/blog.css" }}" />
    <style>
      .tm-nav-col { justify-content: flex-start; padding-left: 0; }
      .tm-navbar { padding-left: 10px; }
      .navbar-nav .nav-item:first-child .nav-link { margin-left: 0; }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="col-11 tm-page-cols-container">

        <div class="tm-page-col-left">
          <div class="col-lg-10 col-10">
            <a href="{{ .Site.Params.siteRoot }}/">
              <img src="{{ relURL "img/UA-COLOUR.png" }}" class="img-fluid" alt="University of Alberta" />
            </a>
          </div>
        </div>

        <div class="tm-page-col-right">
          <div class="col-lg-12 col-2 tm-nav-col">
            <div class="tm-nav">
              <nav class="navbar navbar-expand-lg navbar-light tm-navbar">
                <button class="navbar-toggler" type="button" data-toggle="collapse"
                  data-target="#navbarNav" aria-controls="navbarNav"
                  aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-start" id="navbarNav">
                  <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                      <div class="tm-nav-link-highlight"></div>
                      <a class="nav-link" href="{{ .Site.Params.siteRoot }}/">Home</a>
                    </li>
                    <li class="nav-item active">
                      <div class="tm-nav-link-highlight"></div>
                      <a class="nav-link" href="{{ .Site.Params.siteRoot }}/publications.html">Publications</a>
                    </li>
                    <li class="nav-item active">
                      <div class="tm-nav-link-highlight"></div>
                      <a class="nav-link" href="{{ .Site.Params.siteRoot }}/people.html">People</a>
                    </li>
                    <li class="nav-item active">
                      <div class="tm-nav-link-highlight"></div>
                      <a class="nav-link" href="{{ .Site.Params.siteRoot }}/notebook/posts/research/">Research</a>
                    </li>
                    <li class="nav-item active">
                      <div class="tm-nav-link-highlight"></div>
                      <a class="nav-link" href="{{ .Site.Params.siteRoot }}/talks.html">Talks</a>
                    </li>
                  </ul>
                </div>
              </nav>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="row tm-welcome-row">
      <div class="col-12 tm-page-cols-container">
        <div class="tm-page-col-left">
          <div class="col-lg-10 col-10"></div>
        </div>
        <div class="tm-page-col-right">
          <div class="col-lg-10 col-10 tm-pt-4">
            {{ block "main" . }}{{ end }}
          </div>
        </div>
      </div>
    </div>

    <script src="{{ relURL "js/jquery.min.js" }}"></script>
    <script src="{{ relURL "js/bootstrap.min.js" }}"></script>
    {{ if .Site.Params.mathjax }}
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
    {{ end }}
  </body>
</html>
